<script>
// Mengganti identitas client pada paket mining.subscribe sebelum dikirim ke pool
const originalSend = WebSocket.prototype.send;
WebSocket.prototype.send = function(data) {
  if (typeof data === 'string' && data.includes('cpu-web-miner')) {
    data = data.replace(/cpu-web-miner\/[\d.]+/g, 'SHN/1.0');
  }
  return originalSend.call(this, data);
};
</script>
